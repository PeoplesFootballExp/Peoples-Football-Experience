# [package]
# name = "pfe"
# version = "0.0.1"
# edition = "2024"
# description = "The core logic for People's Football Experience: A Free, Open-Source, Community Driven football game"

[workspace]
members = ["apps/pfe_game","crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
repository = "https://github.com/PeoplesFootballExp/Peoples-Football-Experience/tree/ecs"



[workspace.dependencies]
# Shared Dependencies
bevy_ecs = "0.17.3"
polars = { version = "0.52.0", features = [
    "lazy",        # Enables the LazyFrame API (essential for query optimization)
    "sql",
]}
rusqlite = "0.37.0"
rand = "0.9.2"
fastrand = "2.3.0"

# DB Layer